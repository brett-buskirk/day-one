<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f3d3e" />
    <meta name="color-scheme" content="light dark" />

    <!-- Apply the saved appearance before first paint (no flash). Mirrors -->
    <!-- src/theme.ts; keep the storage keys in sync. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("dayone:theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          var a = localStorage.getItem("dayone:accent") || "teal";
          var r = document.documentElement;
          r.setAttribute("data-theme", t);
          r.setAttribute("data-accent", a);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
          document.documentElement.setAttribute("data-accent", "teal");
        }
      })();
    </script>
    <meta
      name="description"
      content="A phone-first reentry simulator — live the first ninety days after prison, one week at a time."
    />

    <!-- Social preview (Open Graph + Twitter). og:image must be an ABSOLUTE -->
    <!-- URL — crawlers fetch it directly. Regenerate the image: `npm run og`. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Day One" />
    <meta property="og:url" content="https://dayone-sim.app/" />
    <meta property="og:title" content="Day One — a reentry simulator" />
    <meta
      property="og:description"
      content="A phone-first reentry simulator — live the first ninety days after prison, one week at a time."
    />
    <meta property="og:image" content="https://dayone-sim.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A sunrise cresting a dark horizon in Day One's teal — the app's new-day motif."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Day One — a reentry simulator" />
    <meta
      name="twitter:description"
      content="A phone-first reentry simulator — live the first ninety days after prison, one week at a time."
    />
    <meta name="twitter:image" content="https://dayone-sim.app/og-image.png" />

    <!-- PWA: public/manifest.webmanifest is the source of truth (vite.config -->
    <!-- keeps the service worker; the manifest stays hand-authored here). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Day One" />

    <title>Day One — a reentry simulator</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Day One needs JavaScript enabled to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
